name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This job only shells over SSH; it needs no GITHUB_TOKEN scopes.
    permissions: {}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Hardcoded: an unset VPS_SSH_PORT resolves to an empty string and
          # the action cannot negotiate a session.
          port: 22
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            test -d .git || { echo "VPS_PROJECT_DIR is not a Git checkout." >&2; exit 1; }
            # Guard before rebuilding. `docker compose up -d` recreates the
            # container from compose state alone, so a secret that only ever
            # existed as a shell export is dropped and the app fails closed on
            # boot. Refuse to deploy rather than take production down.
            for key in JWT_SECRET ENCRYPTION_KEY; do
              if ! grep -qE "^${key}=.+" .env 2>/dev/null; then
                echo "Refusing to deploy: ${key} is not set in ${PWD}/.env." >&2
                exit 1
              fi
            done
            timeout 2m git fetch origin main
            git reset --hard origin/main
            # Build here: no CI image exists for this app, so --no-build/--pull
            # never would report success while continuing to run the previous
            # image — exactly the silent no-op this replaced.
            timeout 20m docker compose up -d --build
            timeout 30s docker compose ps
            docker image prune -f
            PORT=$(awk -F= '$1 == "WEBUI_PORT" { print $2; exit }' .env 2>/dev/null || true)
            PORT=${PORT:-8080}
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --max-time 5 "http://localhost:${PORT}/" > /dev/null 2>&1; then
                echo "Healthy on port ${PORT}."
                exit 0
              fi
              sleep 5
            done
            timeout 30s docker compose logs --tail=100 alcore || true
            echo "Health check failed on localhost port ${PORT}." >&2
            exit 1
