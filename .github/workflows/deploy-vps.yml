name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This job only shells over SSH; it needs no GITHUB_TOKEN scopes.
    permissions: {}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            test -d .git || { echo "VPS_PROJECT_DIR is not a Git checkout." >&2; exit 1; }
            timeout 2m git fetch origin main
            git reset --hard origin/main
            docker image inspect alcore/alcore:latest >/dev/null
            timeout 2m docker compose up -d --no-build --pull never
            docker image prune -f
            timeout 30s docker compose ps
            PORT=$(awk -F= '$1 == "WEBUI_PORT" { print $2; exit }' .env 2>/dev/null || true)
            PORT=${PORT:-8080}
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --max-time 5 "http://localhost:${PORT}/" > /dev/null 2>&1; then
                echo "Healthy on port ${PORT}."
                exit 0
              fi
              sleep 5
            done
            timeout 30s docker compose logs --tail=100 alcore || true
            echo "Health check failed on localhost port ${PORT}." >&2
            exit 1
