name: OMO Remote Exec (temporary diagnostics shell)

on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command to run on the VPS
        required: true
        type: string

jobs:
  exec:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Run over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: ${{ inputs.command }}
